<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexStore | Mini E-Commerce Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <h2>NexStore<span>.</span></h2>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search products...">
        </div>

        <div class="cart-btn-wrapper" id="cartToggleBtn">
            <button id="cartIconBtn">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Category Filter Bar -->
    <div class="category-bar">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="electronics">Electronics</button>
        <button class="filter-btn" data-category="clothing">Clothing</button>
        <button class="filter-btn" data-category="accessories">Accessories</button>
    </div>

    <!-- Product Catalog Grid -->
    <main class="main-container">
        <h2>Featured Products</h2>
        <div id="productGrid" class="product-grid">
            <!-- JavaScript dynamically inserts cards here -->
        </div>
    </main>

    <!-- Slide-out Cart Drawer -->
    <aside id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Your Shopping Cart</h3>
            <button class="close-btn" id="closeCartBtn">✕</button>
        </div>

        <div id="cartItemsList" class="cart-items">
            <p class="empty-msg">Your cart is currently empty.</p>
        </div>

        <div class="cart-footer">
            <div class="total-row">
                <span>Total Amount:</span>
                <span id="cartTotal">₹0</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        </div>
    </aside>

    <!-- Background Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Separate External Script -->
    <script src="script.js"></script>
</body>
</html>
